<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BASO Art Gallery</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="header-inner">
    <a href="#" class="logo">
      <img src="images/logo-for-light.png" width="200" alt="BASO Art Gallery Logo">
    </a>

    
    <nav class="main-nav" id="main-nav">
      <a href="#home" class="active">Home</a>
      <a href="#artists">Artists</a>
      <a href="#artworks">Artworks</a>
      <a href="#about">About Us</a>
      <a href="#contact">Contact</a>
    </nav>

    <div class="add-icons">
      <button class="shopping-cart" aria-label="View cart">
        <img src="images/shopping-bag.png" width="24" height="24" alt="Cart Icon">
      </button>
      <button class="Account" aria-label="View account">
        <img src="images/user-logo.png" width="24" height="24" alt="User Icon">
      </button>
    </div>

    <div class="header-actions">
      <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>

<h1>Artworks</h1>

<div class="gallery-layout">

  <aside class="filters">

    <h2>Filter</h2>

    <div class="filter-group">
      <h3>Artist</h3>
      <div id="artist-filters"></div>
    </div>

    <div class="filter-group">
      <h3>Year</h3>
      <div id="year-filters"></div>
    </div>

    <div class="filter-group">
      <h3>Medium</h3>
      <div id="medium-filters"></div>
    </div>

    <div class="filter-group">
      <h3>Size</h3>
      <div id="size-filters"></div>
    </div>

    <div class="filter-group">
      <h3>Price</h3>
      <div id="price-filters"></div>
    </div>

  </aside>

  <main class="artworks-area">
    <div id="artworks-container"></div>
  </main>


  <!-- JAVASCRIPT FILES -->
  <script src="artworks.js"></script>
  <script src="script.js"></script>

  
</body>
</html>
