<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="header-inner">

    <a href="index.html" class="logo">
      <img src="images/logo-for-light.png" alt="BASO Art Gallery Logo">
    </a>

    <nav class="main-nav" id="main-nav">
      <a href="index.html">Home</a>
      <a href="#artists">Artists</a>
      <a href="artworks.html" class="active">Artworks</a>
      <a href="#about">About Us</a>
      <a href="#contact">Contact</a>
    </nav>

  <div class="header-actions">

  <button class="icon-btn shopping-cart" aria-label="View cart">
    <img src="images/shopping-bag.svg" alt="">
  </button>

  <button class="icon-btn account" aria-label="View account">
    <img src="images/user-logo.svg" alt="">
  </button>

  <button
    class="icon-btn menu-toggle"
    id="menu-toggle"
    aria-label="Open menu"
    aria-expanded="false"
  >
    <img src="images/toggle.svg" alt="">
  </button>

</div>
  </div>
</header>


<!-- ===== ARTWORKS ===== -->

<h1>Artworks</h1>

<div class="gallery-layout">

  <aside class="filters">

    <div class="filter-group">
      <h3>Artist</h3>
      <div id="artist-filters"></div>
    </div>

    <div class="filter-group">
      <h3>Year</h3>
      <div id="year-filters"></div>
    </div>

    <div class="filter-group">
      <h3>Medium</h3>
      <div id="medium-filters"></div>
    </div>

    <div class="filter-group">
      <h3>Size</h3>
      <div id="size-filters"></div>
    </div>

    <div class="filter-group">
      <h3>Price</h3>
      <div id="price-filters"></div>
    </div>

  </aside>

  <main class="artworks-area">
    <div id="artworks-container"></div>
  </main>
</div>
