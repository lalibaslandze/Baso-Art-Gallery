<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BASO Art Gallery</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="header-inner">
    <a href="#" class="logo">
      <img src="images/logo-for-light.png" width="200" alt="BASO Art Gallery Logo">
    </a>

    
    <nav class="main-nav" id="main-nav">
      <a href="#home" class="active">Home</a>
      <a href="#artists">Artists</a>
      <a href="artworks.html">Artworks</a>
      <a href="#about">About Us</a>
      <a href="#contact">Contact</a>
    </nav>

    <div class="add-icons">
      <button class="shopping-cart" aria-label="View cart">
        <img src="images/shopping-bag.png" width="24" height="24" alt="Cart Icon">
      </button>
      <button class="Account" aria-label="View account">
        <img src="images/user-logo.png" width="24" height="24" alt="User Icon">
      </button>
    </div>

    <div class="header-actions">
      <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>


<!-- ===== HERO ===== -->
<section class="hero" id="home">
  <div class="hero-media">
    <img src="images/hero-image.png" alt="A minimalist gallery space with an abstract painting on display">
  </div>
  <div class="hero-content">
    <h1>Art inspires.<br>Beauty connects.</h1>
    <p>Discover original artworks by emerging and established artists from Georgia.</p>
    <a href="artworks.html" class="btn btn-dark">Explore artworks</a>
  </div>
</section>

<!-- ===== FEATURED ARTWORKS ===== -->
<section class="featured-artworks" id="artworks">
  <h2>Featured Artworks</h2>
  <div id="artworks-container"></div>
</section>

<script src="script.js"></script>
</body>
</html>
