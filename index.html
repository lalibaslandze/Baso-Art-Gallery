<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BASO Art Gallery</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="header-inner">

    <a href="index.html" class="logo">
      <img src="images/logo-for-light.png" alt="BASO Art Gallery Logo">
    </a>

    <nav class="main-nav" id="main-nav">
      <a href="index.html" class="active">Home</a>
      <a href="artists.html">Artists</a>
      <a href="artworks.html">Artworks</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact</a>
    </nav>

  <div class="header-actions">

  <button class="icon-btn shopping-cart" aria-label="View cart">
    <img src="images/shopping-bag.svg" alt="">
  </button>

  <button class="icon-btn account" aria-label="View account">
    <img src="images/user-logo.svg" alt="">
  </button>

  <button
    class="icon-btn menu-toggle"
    id="menu-toggle"
    aria-label="Open menu"
    aria-expanded="false"
  >
    <img src="images/toggle.svg" alt="">
  </button>

</div>
  </div>
</header>


<!-- ===== HERO ===== -->
 
<section class="hero" id="home">

  <div class="hero-media">
    <img
      src="images/hero-image.png"
      alt="A minimalist gallery space with an abstract painting on display"
    >
  </div>

  <div class="hero-content">

    <div class="container">

      <h1>Art inspires.<br>Beauty connects.</h1>

      <p>
        Discover original artworks by emerging and established artists from Georgia.
      </p>

      <a href="artworks.html" class="btn btn-dark">
        Explore artworks
      </a>

    </div>

  </div>

</section>


<!-- ===== FEATURED ARTWORKS ===== -->
<section class="featured-artworks" id="artworks">
  <h2>Featured Artworks</h2>
  <div id="artworks-container"></div>
</section>

<script src="script.js"></script>
</body>
</html>
